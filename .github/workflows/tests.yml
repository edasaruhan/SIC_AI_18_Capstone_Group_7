name: Research software checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install pinned environment
        run: python -m pip install -r requirements-lock.txt
      - name: Check package compatibility
        run: python -m pip check
      - name: Run participant-data-free tests
        run: python -m pytest -q -m "not integration"
      - name: Verify local API
        run: python -m deployment.verify
